name: Build & Auto Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fiddler Everywhere 版本号'
        required: false
        default: '8.0.2'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          npm install -g @electron/asar

      - name: 构建
        env:
          VERSION: ${{ github.event.inputs.version || '8.0.2' }}
        run: |
          chmod +x build.sh
          # tag 触发时使用 tag 名中的版本 (v8.0.2 → 8.0.2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh "" "$VERSION"
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 自动发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version || '8.0.2' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}-r${{ github.run_number }}"
          fi
          NOTES="$(printf '自动构建产物。\n\n验证版本: %s\n使用前必读: 压缩包内「使用说明.txt」\n\n适配指南见 docs/ADAPTATION.md' "$VERSION")"
          gh release create "$TAG" --title "Fiddler Everywhere ${VERSION} 补丁版" --notes "$NOTES" "build/Fiddler-Everywhere-${VERSION}-Patched.zip"
